aid: breaking-bad
name: Breaking Bad
description: >-
  Community-built REST API exposing characters, quotes, episodes, and on-screen deaths from the Breaking Bad and Better
  Call Saul television universe. The original hosted service at breakingbadapi.com is no longer reachable as of
  2026-05-29 (DNS does not resolve). The canonical source code remains at github.com/timbiles/Breaking-Bad--API under
  BSD-3-Clause and is the basis for the historical OpenAPI and capability artifacts in this repo.
